<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roast Manager</title>

  <!-- No-flash theme: set before paint -->
  <script>
    (function () {
      var dark = localStorage.getItem('theme-mode') === 'enabled';
      document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..650&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg rr-nav">
    <div class="container-fluid">
      <a class="navbar-brand rr-brand" href="{{ url_for('index') }}">
        <span class="rr-brand__bean" aria-hidden="true"></span>
        Roast<span class="rr-brand__thin">Manager</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
        <ul class="navbar-nav rr-navlinks">
          <li class="nav-item">
            <a class="nav-link {% if current_page == 'index' %}active{% endif %}"
              href="{{ url_for('index') }}">Roasts</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if current_page == 'beans_list' %}active{% endif %}"
              href="{{ url_for('beans_list') }}">Beans</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if current_page == 's3_settings' %}active{% endif %}"
              href="{{ url_for('s3_settings') }}">S3</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if current_page == 'roast_profile_settings' %}active{% endif %}"
              href="{{ url_for('roast_profile_settings') }}">Profile</a>
          </li>
        </ul>

        <button id="theme-mode-toggle" class="btn rr-theme-toggle" aria-label="Toggle dark mode">
          <i id="theme-mode-icon" class="bi bi-moon-stars"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1080">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <span class="rr-toast-dot" aria-hidden="true"></span>
        <strong class="me-auto" id="toast-title">Notification</strong>
        <small class="text-muted" id="toast-time"></small>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body" id="toast-body"></div>
    </div>
  </div>

  <script>
    function updateThemeIcon(mode) {
      var icon = document.getElementById('theme-mode-icon');
      icon.className = mode === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
    }

    document.addEventListener('DOMContentLoaded', function () {
      updateThemeIcon(document.documentElement.getAttribute('data-bs-theme'));
    });

    document.getElementById('theme-mode-toggle').addEventListener('click', function () {
      var isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
      var next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', next);
      localStorage.setItem('theme-mode', next === 'dark' ? 'enabled' : 'disabled');
      updateThemeIcon(next);
    });

    function toast(title, message) {
      document.getElementById('toast-title').textContent = title;
      document.getElementById('toast-body').textContent = message;
      document.getElementById('toast-time').textContent = 'just now';
      new bootstrap.Toast(document.getElementById('liveToast')).show();
    }
  </script>
</body>

</html>
